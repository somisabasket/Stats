  <body class="antialiased selection:bg-[#00205B] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Cargador directo para cuando GitHub Pages sirve la raíz de main sin compilar (/src/main.tsx no compila en navegador)
      (function() {
        var isStaticHost = window.location.hostname.indexOf('github.io') !== -1 || window.location.protocol === 'file:';
        if (!isStaticHost) return;
        var s = document.createElement('script');
        s.src = './assets/github-loader.js?t=' + Date.now();
        s.defer = true;
        document.body.appendChild(s);
      })();
    </script>
  </body>
