name: Deploy static content to Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps || npm install

      - name: Compilar aplicación (Vite Build + Sincronización Multi-Destino)
        run: npm run build

      - name: Asegurar archivos .nojekyll y 404.html en dist
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html || true

      - name: Guardar cambios compilados (assets/, docs/, dist/) en rama principal si el usuario subió solo archivos .tsx/.json
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets docs dist somisa_data.json .nojekyll || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto-build: actualizar assets, docs y dist tras cambio en código [skip ci]"
            git push origin HEAD || true
          fi

      - name: Actualizar rama gh-pages (para modo Deploy from a branch -> gh-pages)
        continue-on-error: true
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist

      - name: Subir artefacto compilado (para modo GitHub Actions)
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy-actions-pages:
    needs: build
    if: always()
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configurar GitHub Pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Desplegar en GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
