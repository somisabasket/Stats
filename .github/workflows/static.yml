name: Deploy static content to Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        continue-on-error: true
        run: npm install --legacy-peer-deps || npm install || true

      - name: Compilar aplicación (Vite Build) o usar build precompilado
        run: |
          npm run build || true
          if [ ! -f "dist/index.html" ] && [ -d "docs" ]; then
            cp -r docs dist
          fi

      - name: Asegurar archivos .nojekyll y 404.html en dist
        run: |
          mkdir -p dist
          touch dist/.nojekyll
          cp dist/index.html dist/404.html || true

      - name: Actualizar rama gh-pages (para modo Deploy from a branch)
        continue-on-error: true
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist

      - name: Subir artefacto compilado (para modo GitHub Actions)
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy-actions-pages:
    needs: build
    if: always()
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configurar GitHub Pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Desplegar en GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
